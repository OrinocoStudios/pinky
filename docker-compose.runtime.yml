services:
  neo4j:
    image: neo4j:5
    restart: unless-stopped
    ports:
      - "7476:7474"
      - "7689:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - brain-neo4j-runtime-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  brain-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: pinky-runtime:local
    restart: unless-stopped
    ports:
      - "18081:8081"
    environment:
      - PORT=8081
      - NODE_ENV=${NODE_ENV:-production}
      - API_KEY=${API_KEY:-change-me-in-production}
      - CORS_ENABLED=${CORS_ENABLED:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - AUTH_ENABLE_DEV_LOGIN=${AUTH_ENABLE_DEV_LOGIN:-false}
      - AUTH_ENABLE_OAUTH=${AUTH_ENABLE_OAUTH:-true}
      - AUTH_ENABLE_GOOGLE_OAUTH=${AUTH_ENABLE_GOOGLE_OAUTH:-}
      - AUTH_ENABLE_GITHUB_OAUTH=${AUTH_ENABLE_GITHUB_OAUTH:-}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-change-me-auth-secret}
      - AUTH_JWT_EXPIRES_IN=${AUTH_JWT_EXPIRES_IN:-8h}
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-pinky_auth}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAME_SITE=${AUTH_COOKIE_SAME_SITE:-lax}
      - AUTH_ALLOWED_ADMIN_EMAILS=${AUTH_ALLOWED_ADMIN_EMAILS:-}
      - AUTH_SUCCESS_URL=${AUTH_SUCCESS_URL:-http://localhost:5173}
      - AUTH_FAILURE_URL=${AUTH_FAILURE_URL:-http://localhost:5173/login?error=unauthorized}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:8081/auth/google/callback}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:8081/auth/github/callback}
      - ENABLE_API_KEY_AUTH=${ENABLE_API_KEY_AUTH:-true}
      - ENABLE_MULTI_TENANT=${ENABLE_MULTI_TENANT:-false}
      - RATE_LIMIT_TTL=${RATE_LIMIT_TTL:-60000}
      - RATE_LIMIT_GLOBAL=${RATE_LIMIT_GLOBAL:-20}
      - RATE_LIMIT_QUERY=${RATE_LIMIT_QUERY:-10}
      - RATE_LIMIT_UPLOAD=${RATE_LIMIT_UPLOAD:-5}
      - RATE_LIMIT_INGEST=${RATE_LIMIT_INGEST:-10}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - ALLOWED_MIME_TYPES=${ALLOWED_MIME_TYPES:-text/plain,text/markdown,application/json,text/csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
      - ENABLE_CHECKSUM_VALIDATION=${ENABLE_CHECKSUM_VALIDATION:-true}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_password}
      - AI_URL=${AI_URL:-https://ollama.orinocostudios.dev/v1}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-text-embedding-ada-002}
      - OLLAMA_EXTRACTION_MODEL=${OLLAMA_EXTRACTION_MODEL:-qwen35-08b}
      - OLLAMA_AI_MODEL=${OLLAMA_AI_MODEL:-qwen35-08b}
      - OLLAMA_TIMEOUT_MS=${OLLAMA_TIMEOUT_MS:-120000}
      - OBJECT_STORE_PATH=/app/data/objects
      - TOP_K=${TOP_K:-8}
      - CHUNK_SIZE=${CHUNK_SIZE:-1200}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://ollama.orinocostudios.dev/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen35-08b}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-ada-002}
      - OPENAI_EXTRACTION_MODEL=${OPENAI_EXTRACTION_MODEL:-qwen35-08b}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-8192}
      - OPENAI_TIMEOUT_MS=${OPENAI_TIMEOUT_MS:-120000}
      - ENABLE_LLM_DEBUG=${ENABLE_LLM_DEBUG:-true}
    volumes:
      - brain-objects-runtime:/app/data/objects
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  brain-neo4j-runtime-data:
  brain-objects-runtime:
