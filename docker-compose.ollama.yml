services:
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 2G

  ollama-setup:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Pulling embedding model: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}..."
        curl -sf http://ollama:11434/api/pull -d '{"name":"'${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}'"}'
        echo ""
        echo "Pulling LLM model: ${OLLAMA_LLM_MODEL:-llama3.2}..."
        curl -sf http://ollama:11434/api/pull -d '{"name":"'${OLLAMA_LLM_MODEL:-llama3.2}'"}'
        echo ""
        echo "All models ready."

volumes:
  ollama-models:
