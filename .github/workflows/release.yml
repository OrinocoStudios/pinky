# CI + publicación en GHCR + webhooks Dokploy por servicio.
#
# Secretos GitHub (Settings → Secrets and variables → Actions):
#   DOKPLOY_WEBHOOK_BACKEND — despliegue compose API + Neo4j (brain-app); reemplaza DOKPLOY_WEBHOOK_URL
#   DOKPLOY_WEBHOOK_WEB      — despliegue frontend (pinky-web); reemplaza DOKPLOY_WEB_WEBHOOK_URL
#   DOKPLOY_WEBHOOK_STACK    — opcional: redeploy cuando cambia docker-compose.prod.yml (sin nueva imagen API)
#   VITE_API_BASE_URL        — URL pública del API para el build del front

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_backend:
        description: Build y push ghcr.io/.../pinky
        type: boolean
        default: true
      publish_web:
        description: Build y push ghcr.io/.../pinky-web
        type: boolean
        default: true
      trigger_stack_webhook:
        description: Disparar webhook de stack (compose / Neo4j)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile.prod'
              - 'Dockerfile'
              - 'nest-cli.json'
              - 'tsconfig.json'
              - 'tsconfig.build.json'
            web:
              - 'web/**'
            stack:
              - 'docker-compose.prod.yml'
              - 'docker-compose.runtime.yml'

  test-backend:
    name: Backend — build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
      - name: Verificar Dockerfile.prod
        run: docker build -f Dockerfile.prod -t pinky-ci:latest .

  test-web:
    name: Web — tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish-backend:
    name: GHCR pinky (API)
    runs-on: ubuntu-latest
    needs:
      - changes
      - test-backend
    if: |
      success() && (
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_backend == 'true' || github.event.inputs.publish_backend == true)) ||
        (github.event_name == 'push' && needs.changes.outputs.backend == 'true')
      )
    steps:
      - uses: actions/checkout@v4
      - id: image_owner
        name: GHCR owner en minúsculas
        run: echo "registry_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image_owner.outputs.registry_owner }}/pinky
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  webhook-backend:
    name: Dokploy — API + Neo4j
    runs-on: ubuntu-latest
    needs:
      - publish-backend
    if: needs.publish-backend.result == 'success'
    steps:
      - name: POST webhook (DOKPLOY_WEBHOOK_BACKEND o legacy DOKPLOY_WEBHOOK_URL)
        env:
          PRIMARY: ${{ secrets.DOKPLOY_WEBHOOK_BACKEND }}
          LEGACY: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set -e
          HOOK="${PRIMARY:-${LEGACY}}"
          if [ -z "${HOOK}" ]; then
            echo "::notice::Sin webhook backend configurado (DOKPLOY_WEBHOOK_BACKEND / DOKPLOY_WEBHOOK_URL)."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"

  publish-web:
    name: GHCR pinky-web
    runs-on: ubuntu-latest
    needs:
      - changes
      - test-web
    if: |
      success() && (
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_web == 'true' || github.event.inputs.publish_web == true)) ||
        (github.event_name == 'push' && needs.changes.outputs.web == 'true')
      )
    steps:
      - uses: actions/checkout@v4
      - id: image_owner
        name: GHCR owner en minúsculas
        run: echo "registry_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image_owner.outputs.registry_owner }}/pinky-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  webhook-web:
    name: Dokploy — frontend
    runs-on: ubuntu-latest
    needs:
      - publish-web
    if: needs.publish-web.result == 'success'
    steps:
      - name: POST webhook (DOKPLOY_WEBHOOK_WEB o legacy DOKPLOY_WEB_WEBHOOK_URL)
        env:
          PRIMARY: ${{ secrets.DOKPLOY_WEBHOOK_WEB }}
          LEGACY: ${{ secrets.DOKPLOY_WEB_WEBHOOK_URL }}
        run: |
          set -e
          HOOK="${PRIMARY:-${LEGACY}}"
          if [ -z "${HOOK}" ]; then
            echo "::notice::Sin webhook web configurado (DOKPLOY_WEBHOOK_WEB / DOKPLOY_WEB_WEBHOOK_URL)."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"

  webhook-stack:
    name: Dokploy — stack compose
    runs-on: ubuntu-latest
    needs:
      - changes
    if: |
      (
        github.event_name == 'workflow_dispatch' && (github.event.inputs.trigger_stack_webhook == 'true' || github.event.inputs.trigger_stack_webhook == true)
      ) || (
        github.event_name == 'push' && needs.changes.outputs.stack == 'true'
      )
    steps:
      - name: POST webhook stack (opcional)
        env:
          HOOK: ${{ secrets.DOKPLOY_WEBHOOK_STACK }}
        run: |
          set -e
          if [ -z "${HOOK}" ]; then
            echo "::notice::DOKPLOY_WEBHOOK_STACK no configurado; omitiendo redeploy por compose."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"
