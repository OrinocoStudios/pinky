name: CI

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Integration tests
        run: npm run test:e2e -- --runInBand

      - name: Build production image
        run: docker build -f Dockerfile.prod -t pinky-ci:latest .

  web:
    name: Web (typecheck + tests + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build
